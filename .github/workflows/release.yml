name: Release

# 发布流水线（I3）：复用 ci.yml 的测试门禁 → build-xnps.sh 全平台构建
# → 上传 dist/*.tar.gz + sha256sums.txt 到 GitHub Release。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build platform packages
        run: |
          chmod +x build-xnps.sh
          make release

      - name: Package nps-admin source
        run: |
          version="$(grep 'const VERSION' lib/version/version.go | awk -F'"' '{print $2}')"
          ext="$(grep 'const ExtVersion' server/ext/service.go | awk -F'"' '{print $2}')"
          tar -czf "dist/nps-admin-${version}-ext${ext}.tar.gz" \
            --exclude='nps-admin/vendor' \
            --exclude='nps-admin/node_modules' \
            --exclude='nps-admin/.env' \
            --exclude='nps-admin/storage/logs' \
            --exclude='nps-admin/storage/framework' \
            --exclude='nps-admin/database/database.sqlite' \
            --exclude='nps-admin/public/build' \
            nps-admin
          ( cd dist && sha256sum *.tar.gz > sha256sums.txt )

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xnps-dist
          path: dist/*.tar.gz
          retention-days: 7
