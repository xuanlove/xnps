name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Vet (extension packages)
        run: go vet ./cmd/nps ./web/... ./server/ext/... ./lib/acmechallenge/... ./lib/changelog/...
      - name: Test (extension packages)
        run: go test ./server/ext/... ./lib/acmechallenge/... ./lib/changelog/...
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./server/... ./web/... ./lib/... ./cmd/nps

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nps-admin
    env:
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, openssl, curl, zip
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency audit
        run: composer audit --no-dev
      - name: Test
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nps-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nps-admin/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build assets
        run: npm run build

  php-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xnps_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: nps-admin
    env:
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: xnps_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, openssl, curl, zip
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test (MySQL)
        run: php artisan test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config >/dev/null
      - name: Build xnps image
        run: docker build -f Dockerfile.nps -t xnps/server:ci .
      - name: Build nps-admin image
        run: docker build -t xnps/admin:ci ./nps-admin
